name: terraform

on:
  pull_request:
    paths:
      - "infra/gcp/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/gcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate

    defaults:
      run:
        working-directory: infra/gcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        env:
          TF_VAR_auth_google_client_id: ${{ vars.DEVCONTROL_AUTH_GOOGLE_CLIENT_ID }}
          TF_VAR_auth_google_client_secret: ${{ secrets.DEVCONTROL_AUTH_GOOGLE_CLIENT_SECRET }}
          TF_VAR_github_app_id: ${{ vars.DEVCONTROL_GITHUB_APP_ID }}
          TF_VAR_github_app_private_key: ${{ secrets.DEVCONTROL_GITHUB_APP_PRIVATE_KEY }}
          TF_VAR_operator_google_account: ${{ secrets.DEVCONTROL_GCP_OPERATOR_ACCOUNT }}
          TF_VAR_operator_bootstrap_secret: ${{ secrets.DEVCONTROL_OPERATOR_BOOTSTRAP_SECRET }}
          TF_VAR_smtp_password: ${{ secrets.DEVCONTROL_SMTP_PASSWORD }}
        run: |
          terraform plan \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "github_owner=${{ github.repository_owner }}" \
            -var "github_repo=${{ github.event.repository.name }}"
