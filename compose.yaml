services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: devcontrol
      POSTGRES_USER: devcontrol
      POSTGRES_PASSWORD: devcontrol_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcontrol -d devcontrol"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  devcontrol:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      DEVCONTROL_EMAIL_MODE: log
      DEVCONTROL_POSTGRES_HOST: postgres
      DEVCONTROL_POSTGRES_PORT: "5432"
      DEVCONTROL_POSTGRES_DATABASE: devcontrol
      DEVCONTROL_POSTGRES_USERNAME: devcontrol
      DEVCONTROL_POSTGRES_PASSWORD: devcontrol_dev_password
      DEVCONTROL_RUN_MIGRATIONS_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
