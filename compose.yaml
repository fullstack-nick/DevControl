services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: devcontrol
      POSTGRES_USER: devcontrol
      POSTGRES_PASSWORD: ${DEVCONTROL_POSTGRES_PASSWORD:-devcontrol_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcontrol -d devcontrol"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  devcontrol:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      DEVCONTROL_EMAIL_MODE: log
      DEVCONTROL_POSTGRES_HOST: postgres
      DEVCONTROL_POSTGRES_PORT: "5432"
      DEVCONTROL_POSTGRES_DATABASE: devcontrol
      DEVCONTROL_POSTGRES_USERNAME: devcontrol
      DEVCONTROL_POSTGRES_PASSWORD: ${DEVCONTROL_POSTGRES_PASSWORD:-devcontrol_dev_password}
      DEVCONTROL_RUN_MIGRATIONS_ON_STARTUP: "true"
      DEVCONTROL_SCHEDULER_SECRET: ${DEVCONTROL_SCHEDULER_SECRET:-devcontrol_local_scheduler_secret}
      DEVCONTROL_METRICS_ENABLED: "true"
      DEVCONTROL_RETENTION_RATE_LIMIT_WINDOWS_DAYS: "14"
      DEVCONTROL_RETENTION_MONITOR_CHECKS_DAYS: "30"
      DEVCONTROL_RETENTION_WEBHOOK_PREVIEW_DAYS: "30"
      DEVCONTROL_RETENTION_WEBHOOK_DELIVERIES_DAYS: "90"
      DEVCONTROL_CLEANUP_BATCH_SIZE: "500"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.13.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
    depends_on:
      - devcontrol
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${DEVCONTROL_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/devcontrol-stage-9.json
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres-data:
